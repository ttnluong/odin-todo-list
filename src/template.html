<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Fredoka:400,500,600;">
    <title>To Do List</title>
</head>
<body>
   <div class="container">
        <aside class="sidebar">
            <ul class="sidebar-all">
                <li>All</li>
                <li>Today</li>
            </ul>
            <h3>
                My Projects
            </h3>
             <ul class="sidebar-projects">
                <!-- render project list -->
            </ul>
             <li class="add-project-item">
                <button class="add-project-btn" command="show-modal" commandfor="project-modal">+ add project</button>
            </li>
        </nav>
        <main>
            <header>
                <!-- title -->
            </header>
            <section>
                <!-- render cards -->
            </section>
        </main>
        <aside class="task-form">
            <!-- edit form -->
        </aside>
   </div>
   <dialog class="modal" id="project-modal">
        <form id="project-form">
            <div class="form-wrapper">
                <h2>Add project</h2>
                <hr>
                <div class="form-content">
                    <label for="project-title">Title *</label>
                    <input type="text" id="project-title" name="title" required>
                </div>
                <div class="form-content">
                    <label for="project-description">Description</label>
                        <input type="text" id="project-description" name="description">
                </div>
                <div class="form-content">
                    <label for="project-color">Color</label>
                    <input type="number" id="project-color" name="color">
                </div>
            </div>
            <div class="add-project-button">
                <button type="button" class="cancel-btn" commandfor="project-modal" command="close">Cancel</button>
                <button type="submit" class="submit-btn" id="submit">Add project</button>
            </div>
        </form>
    </dialog>
</body>
</html>
