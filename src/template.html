<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600;">
    <title>To Do List</title>
</head>
<body>
   <div class="container">
        <aside class="sidebar" id="sidebar">
            <section class="sidebar-views">
                <ul class="views-list">
                    <!-- render view list -->
                </ul>
            </section>
            <section class="sidebar-projects">
                <h3>
                    PROJECTS
                </h3>
                 <ul class="projects-list">
                    <!-- render project list -->
                </ul>
                <button class="add-project-btn" id="add-project-btn" command="show-modal" commandfor="project-modal">
                    <svg class="add-project-icon"><use href="./assets/lucide-sprite.svg#plus"></svg>
                </button>
            </section>
        </aside> 
        <main>
            <header>
                <div class="header-top">
                    <h1 id="header-title"></h1>
                    <p id="header-description"></p>
                    <button class="btn btn-primary color"id="add-task-btn" command="show-modal" commandfor="task-modal">+ add task</button>
                </div>
                <div class="header-content">
                    <span></span>
                    <span>title</span>
                    <span>project</span>
                    <span>due date</span>
                    <span>priority</span>
                </div>
            </header>
            <section class="tasks-list" id="tasks-list">
                <!-- render cards -->
            </section>
        </main>
        <aside class="task-form">
            <form class="form-sidebar hidden" id="edit-task-form">
                <div class="form-wrapper">
                    <h2>Edit details</h2>
                    <hr>
                    <div class="form-content">
                        <label for="edit-task-title">Title *</label>
                        <input type="text" id="edit-task-title" name="title" required>
                    </div>
                    <div class="form-content">
                        <label for="edit-task-description">Description</label>
                        <input type="text" id="edit-task-description" name="description">
                    </div>
                    <div class="form-content">
                        <label for="edit-task-due">Due Date</label>
                        <input type="date" id="edit-task-due" name="dueDate">
                    </div>
                    <div class="form-content">
                        <label for="edit-task-priority">Priority</label>
                        <select id="edit-task-priority" name="priority">
                            <option value="">Select priority</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div class="form-content">
                        <label for="edit-task-project">Project</label>
                        <select id="edit-task-project" name="projectId">
                            <!-- render project list -->
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-neutral" id="edit-task-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="submit">Add task</button>
                </div>
            </form>
        </aside>
   </div>
   <dialog class="modal" id="project-modal">
        <form class="form-modal" id="project-form">
            <div class="form-wrapper">
                <h2 id="project-modal-title">Add project</h2>
                <div class="form-content">
                    <label for="project-title">Title *</label>
                    <input type="text" id="project-title" name="title" required>
                </div>
                <div class="form-content">
                    <label for="project-description">Description</label>
                    <textarea rows="6" id="project-description" name="description"></textarea>
                </div>
                <div class="form-content">
                    <label for="project-color">Choose a color</label>
                    <div class="color-picker" id="project-color-picker">
                        <button type="button" class="color-swatch selected" data-color="#878282" style="background:#878282"></button>
                        <button type="button" class="color-swatch" data-color="#F15B50" style="background:#F15B50"></button>
                        <button type="button" class="color-swatch" data-color="#FCA700" style="background:#FCA700"></button>
                        <button type="button" class="color-swatch" data-color="#EED12B" style="background:#EED12B"></button>
                        <button type="button" class="color-swatch" data-color="#94C748" style="background:#94C748"></button>
                        <button type="button" class="color-swatch" data-color="#2ABB7F" style="background:#2ABB7F"></button>
                        <button type="button" class="color-swatch" data-color="#42B2D7" style="background:#42B2D7"></button>
                        <button type="button" class="color-swatch" data-color="#4688EC" style="background:#4688EC"></button>
                        <button type="button" class="color-swatch" data-color="#BF63F3" style="background:#BF63F3"></button>
                        <button type="button" class="color-swatch" data-color="#DA62AC" style="background:#DA62AC"></button>
                    </div>
                    <input type="hidden" id="project-color" value="#878282">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-neutral" commandfor="project-modal" command="close">Cancel</button>
                <button type="submit" class="btn btn-primary" id="submit">Add project</button>
            </div>
        </form>
    </dialog>
    <dialog class="modal" id="task-modal">
        <form class="form-modal" id="task-form">
            <div class="form-wrapper">
                <h2 id="project-modal-title">Add task</h2>
                <hr>
                <div class="form-content">
                    <label for="task-title">Title *</label>
                    <input type="text" id="task-title" name="title" required>
                </div>
                <div class="form-content">
                    <label for="task-description">Description</label>
                    <input type="text" id="task-description" name="description">
                </div>
                <div class="form-content">
                    <label for="task-due">Due Date</label>
                    <input type="date" id="task-due" name="dueDate">
                </div>
                <div class="form-content">
                    <label for="task-priority">Priority</label>
                    <select id="task-priority" name="priority">
                        <option value="">Select priority</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="form-content">
                    <label for="task-project">Project</label>
                    <select id="task-project" name="projectId">
                        <!-- render project list -->
                    </select>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-neutral" commandfor="task-modal" command="close">Cancel</button>
                <button type="submit" class="btn btn-primary" id="submit">Save</button>
            </div>
        </form>
    </dialog>
    <dialog class="modal" id="project-delete-modal">
        <div class="delete-modal">
            <div class="modal-wrapper">
                <h2>Delete project</h2>
                <p id="project-delete-msg">Are you sure you want to delete this project? This will also delete all of its tasks.</p>
                <div class="modal-actions">
                    <button class="btn btn-neutral" commandfor="project-delete-modal" command="close">Cancel</button>
                    <button class="btn btn-danger" id="project-delete-btn">Delete project</button>
                </div>
            </div>
        </div>
    </dialog>
    <ul class="context-menu hidden" id="project-context-menu">
        <li><button type="button" id="context-edit-btn">Edit project</button></li>
        <li><button type="button" id="context-delete-btn">Delete project</button></li>
    </ul>
</body>
</html>
