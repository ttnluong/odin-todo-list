<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Fredoka:400,500,600;">
    <title>To Do List</title>
</head>
<body>
   <div class="container">
        <aside class="sidebar" id="sidebar">
            <section class="sidebar-views">
                <ul class="views-list">
                    <!-- render view list -->
                </ul>
            </section>
            <section class="sidebar-projects">
                <h3>
                    My Projects
                </h3>
                 <ul class="projects-list">
                    <!-- render project list -->
                </ul>
                 <li class="add-project-item">
                    <button id="add-project-btn" command="show-modal" commandfor="project-modal">+ add project</button>
                </li>
            </section>
        </aside> 
        <main>
            <header>
                <div class="header-main">
                    <h1 id="header-title"></h1>
                    <p id="header-description"></p>
                    <button id="add-task-btn" command="show-modal" commandfor="task-modal">+ add task</button>
                </div>
                <div class="header-content">
                    <span></span>
                    <span>title</span>
                    <span>project</span>
                    <span>due date</span>
                    <span>priority</span>
                </div>
            </header>
            <section class="tasks-list" id="tasks-list">
                <!-- render cards -->
            </section>
        </main>
        <aside class="task-form">
            <form id="edit-task-form" class="hidden">
                <div class="form-wrapper">
                    <h2>Edit details</h2>
                    <hr>
                    <div class="form-content">
                        <label for="edit-task-title">Title *</label>
                        <input type="text" id="edit-task-title" name="title" required>
                    </div>
                    <div class="form-content">
                        <label for="edit-task-description">Description</label>
                        <input type="text" id="edit-task-description" name="description">
                    </div>
                    <div class="form-content">
                        <label for="edit-task-due">Due Date</label>
                        <input type="date" id="edit-task-due" name="dueDate">
                    </div>
                    <div class="form-content">
                        <label for="edit-task-priority">Priority</label>
                        <select id="edit-task-priority" name="priority">
                            <option value="">Select priority</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div class="form-content">
                        <label for="edit-task-project">Project</label>
                        <select id="edit-task-project" name="projectId">
                            <!-- render project list -->
                        </select>
                    </div>
                </div>
                <div class="project-form-buttons">
                    <button type="button" class="cancel-btn" id="edit-task-cancel">Cancel</button>
                    <button type="submit" class="submit-btn" id="submit">Add task</button>
                </div>
            </form>
        </aside>
   </div>
   <dialog class="modal" id="project-modal">
        <form id="project-form">
            <div class="form-wrapper">
                <h2>Add project</h2>
                <hr>
                <div class="form-content">
                    <label for="project-title">Title *</label>
                    <input type="text" id="project-title" name="title" required>
                </div>
                <div class="form-content">
                    <label for="project-description">Description</label>
                    <input type="text" id="project-description" name="description">
                </div>
                <div class="form-content">
                    <label for="project-color">Color</label>
                    <input type="number" id="project-color" name="color">
                </div>
            </div>
            <div class="project-form-buttons">
                <button type="button" class="cancel-btn" commandfor="project-modal" command="close">Cancel</button>
                <button type="submit" class="submit-btn" id="submit">Add project</button>
            </div>
        </form>
    </dialog>
    <dialog class="modal" id="task-modal">
        <form id="task-form">
            <div class="form-wrapper">
                <h2>Add task</h2>
                <hr>
                <div class="form-content">
                    <label for="task-title">Title *</label>
                    <input type="text" id="task-title" name="title" required>
                </div>
                <div class="form-content">
                    <label for="task-description">Description</label>
                    <input type="text" id="task-description" name="description">
                </div>
                <div class="form-content">
                    <label for="task-due">Due Date</label>
                    <input type="date" id="task-due" name="dueDate">
                </div>
                <div class="form-content">
                    <label for="task-priority">Priority</label>
                    <select id="task-priority" name="priority">
                        <option value="">Select priority</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="form-content">
                    <label for="task-project">Project</label>
                    <select id="task-project" name="projectId">
                        <!-- render project list -->
                    </select>
                </div>
            </div>
            <div class="project-form-buttons">
                <button type="button" class="cancel-btn" commandfor="task-modal" command="close">Cancel</button>
                <button type="submit" class="submit-btn" id="submit">Add task</button>
            </div>
        </form>
    </dialog>
</body>
</html>
